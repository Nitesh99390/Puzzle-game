<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Color Pour: Neta Edition — a juicy colour-sorting puzzle with famous Indian neta meme voices. Sort the colours, hear the dialogues.">
  <meta name="theme-color" content="#140B2E">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Color Pour">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Color Pour · Neta Edition</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: radial-gradient(circle at 50% 0%, #2b1266 0%, #140b2e 60%, #0b0620 100%);
      overflow: hidden; touch-action: manipulation;
    }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #e8e3ff; letter-spacing: .28em; font-size: 13px;
      transition: opacity .45s ease; z-index: 5;
    }
    #loading .tube {
      width: 46px; height: 132px; border: 3px solid rgba(255,255,255,.45);
      border-radius: 8px 8px 24px 24px; position: relative; overflow: hidden;
      background: rgba(255,255,255,.05);
    }
    #loading .tube::after {
      content: ""; position: absolute; left: 4px; right: 4px; bottom: 0;
      height: 40%; border-radius: 0 0 20px 20px;
      background: linear-gradient(180deg, #ff9933 0 30%, #ffffff 30% 60%, #1fb34a 60%);
      animation: fill 2.4s ease-in-out infinite;
    }
    @keyframes fill {
      0% { height: 8%; }
      45% { height: 84%; }
      70% { height: 84%; }
      100% { height: 8%; }
    }
    .hide { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="loading">
    <div class="tube"></div>
    <div>COLOR POUR</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var l = document.getElementById('loading');
      if (l) { l.classList.add('hide'); setTimeout(function(){ l.remove(); }, 500); }
    });
  </script>
</body>
</html>
